<button mat-stroked-button type="button" class="filter-trigger" [matMenuTriggerFor]="veiculoMenu" #vehicleMenuTrigger="matMenuTrigger">
  {{ getLabel() }}
  <mat-icon>arrow_drop_down</mat-icon>
</button>

<mat-menu #veiculoMenu="matMenu" panelClass="veiculo-filter-menu-panel">
  <div class="veiculo-menu-panel" (click)="$event.stopPropagation()">
    <app-veiculos-menu
      [grupos]="filteredGrupos()"
      [allVehiclesPerGroup]="allVehicles()"
      [filteredVehiclesPerGroup]="filteredVehicles()"
      [automotorChecked]="automotorChecked()"
      [naoAutomotorChecked]="naoAutomotorChecked()"
      (filterByType)="typeVehicleFilter($event)"
      (filterBySearch)="searchToFilter($event)"
      (selectGroup)="updateSelectedGroups($event)"
      (closeMenu)="vehicleMenuTrigger.closeMenu()"
      (selectVehicle)="selectVehicle($event)"
    />
  </div>
</mat-menu>
