<button
  #horarioMenuTrigger="matMenuTrigger"
  mat-stroked-button
  type="button"
  class="filter-trigger"
  [matMenuTriggerFor]="horarioMenu"
  (menuOpened)="onMenuOpened()"
>
  <span class="filter-trigger__label">
    @if (hasAppliedRange()) {
      <mat-icon class="filter-trigger__clock-icon">schedule</mat-icon>
    }
    <span>{{ getLabel() }}</span>
  </span>
  <mat-icon>arrow_drop_down</mat-icon>
</button>

<mat-menu #horarioMenu="matMenu" panelClass="filter-menu-no-scroll">
  <div class="horario-menu-panel" (click)="$event.stopPropagation()">
    <div class="horario-menu-inputs">
      <div class="horario-field">
        <mat-form-field class="horario-field__control" appearance="outline" subscriptSizing="dynamic">
          <mat-label>Initial hour</mat-label>
          <input matInput [matTimepicker]="pickerInicio" [(ngModel)]="draftHorarioInicio" />
          <mat-timepicker-toggle class="horario-field__toggle" [for]="pickerInicio" />
          <mat-timepicker #pickerInicio />
        </mat-form-field>
      </div>

      <div class="horario-field">
        <mat-form-field class="horario-field__control" appearance="outline" subscriptSizing="dynamic">
          <mat-label>Final hour</mat-label>
          <input matInput [matTimepicker]="pickerFim" [(ngModel)]="draftHorarioFim" />
          <mat-timepicker-toggle class="horario-field__toggle" [for]="pickerFim" />
          <mat-timepicker #pickerFim />
        </mat-form-field>
      </div>
    </div>

    <div class="horario-menu-actions">
      <button mat-button matMenuClose type="button" (click)="onCancel()">Cancelar</button>
      <button mat-stroked-button type="button" (click)="onApply()">Aplicar</button>
    </div>
  </div>
</mat-menu>
