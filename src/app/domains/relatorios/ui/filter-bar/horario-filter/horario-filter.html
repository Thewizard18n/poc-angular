<button
  mat-stroked-button
  type="button"
  class="filter-trigger"
  [matMenuTriggerFor]="horarioMenu"
  (menuOpened)="onMenuOpened()"
>
  <span class="filter-trigger__label">
    @if (hasAppliedRange()) {
      <mat-icon class="filter-trigger__clock-icon">schedule</mat-icon>
    }
    <span>{{ getLabel() }}</span>
  </span>
  <mat-icon>arrow_drop_down</mat-icon>
</button>

<mat-menu #horarioMenu="matMenu" panelClass="filter-menu-no-scroll">
  <div class="horario-menu-panel" (click)="$event.stopPropagation()">
    <div class="horario-menu-inputs">
      <mat-form-field appearance="outline" subscriptSizing="dynamic" class="horario-field">
        <mat-label>Initial hour</mat-label>
        <input matInput type="time" [(ngModel)]="draftHorarioInicio" />
      </mat-form-field>

      <mat-form-field appearance="outline" subscriptSizing="dynamic" class="horario-field">
        <mat-label>Final hour</mat-label>
        <input matInput type="time" [(ngModel)]="draftHorarioFim" />
      </mat-form-field>
    </div>

    <div class="horario-menu-actions">
      <button mat-button matMenuClose type="button" (click)="onCancel()">Cancelar</button>
      <button mat-stroked-button matMenuClose type="button" (click)="onApply()">Aplicar</button>
    </div>
  </div>
</mat-menu>
