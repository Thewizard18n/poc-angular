<button mat-stroked-button type="button" class="filter-trigger" [matMenuTriggerFor]="colunasMenu">
  Colunas
  <mat-icon>arrow_drop_down</mat-icon>
</button>

<mat-menu #colunasMenu="matMenu" panelClass="filter-menu-no-scroll">
  <div class="colunas-menu-panel" (click)="$event.stopPropagation()">
    <mat-form-field class="colunas-selected-field" appearance="outline" subscriptSizing="dynamic">
      <input
        matInput
        [value]="getColunasSelecionadasLabel()"
        [title]="getColunasSelecionadasLabel()"
        readonly
      />
    </mat-form-field>

    <div class="colunas-items-list" cdkDropList (cdkDropListDropped)="onDrop($event)">
      @for (coluna of colunas(); track coluna.id) {
        <div class="column-item" cdkDrag>
          <mat-checkbox
            class="column-checkbox"
            color="primary"
            [checked]="coluna.visible"
            (click)="$event.stopPropagation()"
            (change)="colunaToggle.emit(coluna.id)"
          >
            {{ coluna.label }}
          </mat-checkbox>
          <button mat-icon-button type="button" cdkDragHandle aria-label="Reordenar coluna">
            <mat-icon>drag_indicator</mat-icon>
          </button>
        </div>
      }
    </div>
  </div>
</mat-menu>
