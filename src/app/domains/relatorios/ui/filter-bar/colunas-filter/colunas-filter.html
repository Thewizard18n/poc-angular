<button mat-stroked-button type="button" class="filter-trigger" [matMenuTriggerFor]="colunasMenu">
  Colunas
  <mat-icon>arrow_drop_down</mat-icon>
</button>

<mat-menu #colunasMenu="matMenu" panelClass="filter-menu-no-scroll">
  <div class="colunas-menu-panel" (click)="$event.stopPropagation()">
    <mat-form-field class="colunas-selected-field" appearance="outline" subscriptSizing="dynamic">
      <input
        matInput
        [value]="getColunasSelecionadasLabel()"
        [title]="getColunasSelecionadasLabel()"
        readonly
      />
    </mat-form-field>

    <div class="colunas-items-list">
      @for (coluna of visibleSortedColunas(); track coluna.key) {
        <div class="column-item">
          <mat-checkbox
            class="column-checkbox"
            color="primary"
            [checked]="coluna.visibility"
            (click)="$event.stopPropagation()"
            (change)="colunaToggle.emit(coluna.key)"
          >
            {{ coluna.label }}
          </mat-checkbox>
        </div>
      }
    </div>
  </div>
</mat-menu>
